<script>
  const isVerified = sessionStorage.getItem('slyce_verified');
  const verifyTime = sessionStorage.getItem('slyce_verify_time');
  
  if (!isVerified || !verifyTime || (Date.now() - parseInt(verifyTime)) > 7200000) {
    sessionStorage.removeItem('slyce_verified');
    sessionStorage.removeItem('slyce_verify_time');
    window.location.href = 'verify.html';
  }
</script>
