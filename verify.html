<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <!-- Google reCAPTCHA - API correta -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f1f1f1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verify-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #202124;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #5f6368;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        hr {
            border: none;
            border-top: 1px solid #dadce0;
            margin: 1rem 0;
        }

        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
            min-height: 80px;
        }

        .btn-verify {
            background: #1a73e8;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-verify:hover:not(:disabled) {
            background: #1557b0;
        }

        .btn-verify:disabled {
            background: #dadce0;
            cursor: not-allowed;
            color: #5f6368;
        }

        .error-message {
            color: #d93025;
            font-size: 0.75rem;
            margin-top: 0.8rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            margin-top: 0.8rem;
            font-size: 0.75rem;
            color: #5f6368;
        }

        .loading.show {
            display: block;
        }

        .security-footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #dadce0;
        }

        .security-footer p {
            font-size: 0.7rem;
            color: #5f6368;
            margin: 0.4rem 0;
        }

        .security-footer i {
            margin-right: 4px;
            color: #1a73e8;
        }
    </style>
</head>
<body>
    <div class="verify-box">
        <h1 class="title">Verificação de Segurança</h1>
        <p class="subtitle">Confirme que você é humano para continuar</p>

        <hr>

        <div class="recaptcha-wrapper">
            <!-- ⚠️ IMPORTANTE: Para remover o aviso, cadastre seu site no Google e cole sua SITE KEY aqui -->
            <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI" data-callback="onRecaptchaSuccess" data-expired-callback="onRecaptchaExpired"></div>
        </div>

        <button id="verifyBtn" class="btn-verify" disabled>
            Verificar e Acessar
        </button>

        <div id="errorMessage" class="error-message">
            ⚠️ Marque "Não sou um robô" para continuar.
        </div>

        <div id="loading" class="loading">
            ⏳ Verificando, redirecionando...
        </div>

        <div class="security-footer">
            <p><i class="fas fa-shield-alt"></i> Ambiente seguro e protegido</p>
            <p><i class="fas fa-clock"></i> Verificação automática em tempo real</p>
            <p><i class="fas fa-robot"></i> Proteção avançada contra bots</p>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        let recaptchaVerified = false;

        window.onRecaptchaSuccess = function(token) {
            recaptchaVerified = true;
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = false;
            document.getElementById('errorMessage').classList.remove('show');
        };

        window.onRecaptchaExpired = function() {
            recaptchaVerified = false;
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
        };

        document.getElementById('verifyBtn').addEventListener('click', function() {
            if (!recaptchaVerified) {
                document.getElementById('errorMessage').classList.add('show');
                return;
            }

            const loading = document.getElementById('loading');
            const verifyBtn = this;
            verifyBtn.disabled = true;
            loading.classList.add('show');

            sessionStorage.setItem('slyce_recaptcha_verified', 'true');
            sessionStorage.setItem('slyce_recaptcha_time', Date.now());

            setTimeout(function() {
                window.location.href = 'index.html';
            }, 1500);
        });

        const alreadyVerified = sessionStorage.getItem('slyce_recaptcha_verified');
        const verifyTime = sessionStorage.getItem('slyce_recaptcha_time');

        if (alreadyVerified === 'true' && verifyTime) {
            const timePassed = Date.now() - parseInt(verifyTime);
            if (timePassed < 7200000) {
                window.location.href = 'index.html';
            } else {
                sessionStorage.removeItem('slyce_recaptcha_verified');
                sessionStorage.removeItem('slyce_recaptcha_time');
            }
        }
    </script>
</body>
</html>
